name: Auto Merge PRs

on:
  schedule:
    # 하루 7번 실행 (KST 기준)
    - cron: '0 17 * * *'  # 오전 2시 KST
    - cron: '0 21 * * *'  # 오전 6시 KST
    - cron: '0 1 * * *'   # 오전 10시 KST
    - cron: '0 5 * * *'   # 오후 2시 KST
    - cron: '0 9 * * *'   # 오후 6시 KST
    - cron: '0 13 * * *'  # 오후 10시 KST
    - cron: '30 14 * * *' # 오후 11시 30분 KST
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto merge all open PRs
        id: merge-prs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            
            console.log(`🔍 Fetching open PRs for ${owner}/${repo}...`);
            
            // 모든 열려있는 PR 가져오기
            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'asc'
            });
            
            if (pullRequests.length === 0) {
              console.log('✅ No open PRs to merge.');
              return;
            }
            
            console.log(`📋 Found ${pullRequests.length} open PR(s).`);
            
            const results = {
              success: [],
              failed: []
            };
            
            for (const pr of pullRequests) {
              console.log(`\n🔄 Processing PR #${pr.number}: ${pr.title}`);
              
              try {
                // PR 상세 정보 가져오기
                let { data: prDetails } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number
                });
                
                // Draft PR인 경우 Ready for Review 상태로 변경
                if (prDetails.draft) {
                  console.log(`📝 PR #${pr.number} is a draft. Converting to ready for review...`);
                  
                  try {
                    // GraphQL mutation을 사용하여 draft 상태 해제
                    await github.graphql(`
                      mutation($pullRequestId: ID!) {
                        markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) {
                          pullRequest {
                            isDraft
                          }
                        }
                      }
                    `, {
                      pullRequestId: prDetails.node_id
                    });
                    
                    console.log(`✅ PR #${pr.number} is now ready for review.`);
                    
                    // 상태 변경 후 잠시 대기 (GitHub가 mergeable 상태를 업데이트할 시간)
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    
                    // PR 정보 다시 가져오기
                    const updatedPr = await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: pr.number
                    });
                    prDetails = updatedPr.data;
                    
                  } catch (draftError) {
                    console.log(`⚠️ Failed to convert draft PR #${pr.number}: ${draftError.message}`);
                    results.failed.push({
                      number: pr.number,
                      title: pr.title,
                      reason: `Failed to convert from draft: ${draftError.message}`
                    });
                    continue;
                  }
                }
                
                // PR이 머지 가능한지 확인
                if (!prDetails.mergeable) {
                  console.log(`⚠️ PR #${pr.number} is not mergeable (conflicts or pending checks).`);
                  results.failed.push({
                    number: pr.number,
                    title: pr.title,
                    reason: 'Not mergeable (conflicts or pending checks)'
                  });
                  continue;
                }
                
                // PR 머지 실행
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'merge' // 'merge', 'squash', 'rebase' 중 선택
                });
                
                console.log(`✅ Successfully merged PR #${pr.number}`);
                results.success.push({
                  number: pr.number,
                  title: pr.title
                });
                
              } catch (error) {
                console.log(`❌ Failed to merge PR #${pr.number}: ${error.message}`);
                results.failed.push({
                  number: pr.number,
                  title: pr.title,
                  reason: error.message
                });
              }
            }
            
            // 결과 요약 출력
            console.log('\n📊 === MERGE SUMMARY ===');
            console.log(`✅ Successfully merged: ${results.success.length}`);
            results.success.forEach(pr => {
              console.log(`   - PR #${pr.number}: ${pr.title}`);
            });
            
            if (results.failed.length > 0) {
              console.log(`❌ Failed to merge: ${results.failed.length}`);
              results.failed.forEach(pr => {
                console.log(`   - PR #${pr.number}: ${pr.title}`);
                console.log(`     Reason: ${pr.reason}`);
              });
            }
            
            // 텔레그램 알림용 결과 저장
            core.setOutput('success_count', results.success.length);
            core.setOutput('failed_count', results.failed.length);
            core.setOutput('total_prs', pullRequests.length);
            
            // 상세 결과 메시지 생성
            let message = `📊 *Auto Merge Report*\n\n`;
            message += `📍 Repository: \`${owner}/${repo}\`\n`;
            message += `⏰ Time: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}\n\n`;
            
            if (pullRequests.length === 0) {
              message += `✅ 처리할 PR이 없습니다.`;
            } else {
              message += `📋 총 ${pullRequests.length}개 PR 처리\n`;
              message += `✅ 성공: ${results.success.length}개\n`;
              message += `❌ 실패: ${results.failed.length}개\n\n`;
              
              if (results.success.length > 0) {
                message += `*성공한 PR:*\n`;
                results.success.forEach(pr => {
                  message += `  • #${pr.number}: ${pr.title}\n`;
                });
              }
              
              if (results.failed.length > 0) {
                message += `\n*실패한 PR:*\n`;
                results.failed.forEach(pr => {
                  message += `  • #${pr.number}: ${pr.title}\n`;
                  message += `    사유: ${pr.reason}\n`;
                });
              }
            }
            
            core.setOutput('telegram_message', message);

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: ${{ steps.merge-prs.outputs.telegram_message }}
